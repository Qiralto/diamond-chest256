
name: Compile Diamond Chest 256

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Compiler le mod
        run: gradle build --stacktrace

      - name: Recuperer le JAR
        uses: actions/upload-artifact@v4
        with:
          name: diamond-chest-256
          path: build/libs/*.jar
